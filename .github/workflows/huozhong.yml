name: Auto Fetch Huozhong Nodes

on:
  schedule:
    - cron: '0 5 * * *' # 每天北京时间 13 点更新节点
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

jobs:
  run-huozhong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Script
        run: python 火种.py

      - name: Commit and Push Subscriptions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add huozhong_links.txt huozhong_sub_base64.txt
          git commit -m "Auto update Huozhong nodes [skip ci]" || echo "No changes to commit"
          git push
